services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: .env
    ports:
      - "${BACKEND_PORT}:${BACKEND_PORT}"
    volumes:
      - sqlite_data:/app/backend/db
    networks:
      - app_network
    healthcheck:
      test: ["CMD", "wget", "-qO-", "${NEXT_PUBLIC_API_URL}/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    env_file: .env
    ports:
      - "${FRONTEND_PORT}:${FRONTEND_PORT}"
    networks:
      - app_network
    depends_on:
      backend:
        condition: service_healthy

volumes:
  sqlite_data:

networks:
  app_network:
    driver: bridge
